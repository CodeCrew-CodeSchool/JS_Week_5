<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>Build Your Hobbit</h1>
        <input type="text" name="name" id="name"/>
        <input type="color" name="skintone" id="skintone"/>
        <input type="number" name="heightFt" id="heightFt"/>
        <input type="number" name="heightIn" id="heightIn"/>
        <select name="hair" id="hair">
            <option value="">Select a Hairstyle</option>
            <option value="waves">Waves</option>
            <option value="locs">Locs</option> <!--Bruce said...-->
            <option value="fade">Fade</option>
            <option value="ss">Super Saiyan</option>
            <option value="mullet">Mullet</option>
            <option value="bald">Bald</option>
            <option value="cornrows">Cornrows</option>
            <option value="wicks">Wicks</option>
        </select>
        <input type="text" name="shoes" id="shoes"/>
        <input type="number" name="weight" id="weight"/>
        <input type="submit"/>
    </form>
    <script src="index.js"></script>
</body>
</html>
